<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>미니법정</title>
<style>
  :root{
    --wood-dark:#2b1c12;
    --wood:#4a2f1c;
    --wood-light:#6b4526;
    --parchment:#ece1c4;
    --parchment-dim:#cfc09a;
    --ink:#231a12;
    --brass:#c9a24b;
    --brass-dim:#8a6d33;
    --crimson:#7a2230;
    --crimson-light:#a83c4a;
    --navy:#1e3350;
    --navy-light:#3a5a86;
    --danger:#c0392b;
    --ok:#4a7a4a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#0d0805;
    font-family:'Courier New',ui-monospace,monospace;
    color:var(--parchment);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100%;
    max-width:480px;
    height:100vh;
    max-height:854px;
    margin:0 auto;
    background:linear-gradient(180deg,var(--wood-dark) 0%, var(--wood) 55%, var(--wood-dark) 100%);
    border-left:4px solid var(--brass-dim);
    border-right:4px solid var(--brass-dim);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #stage.large-text #dText{font-size:16px;}
  #stage.large-text .overlay p{font-size:15px;}
  #stage.large-text .lawtext{font-size:15px;}
  #stage.large-text .np-headline{font-size:17px;}
  canvas.pixel{image-rendering:pixelated;image-rendering:crisp-edges;}

  /* ---------- HUD ---------- */
  #hud{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 12px;
    background:rgba(0,0,0,0.35);
    border-bottom:2px solid var(--brass-dim);
    font-size:11px;
    letter-spacing:1px;
    z-index:5;
  }
  #hud .case-label{color:var(--brass);}
  #hudRight{display:flex;align-items:center;gap:6px;}
  #suspicion{display:flex;gap:3px;align-items:center;}
  .eye{width:10px;height:10px;background:#3a3a3a;border:1px solid #111;}
  .eye.on{background:var(--danger);box-shadow:0 0 4px var(--danger);}
  #muteBtn,#evidenceBtn,#settingsBtn,#summaryBtn{
    background:none;border:1px solid var(--brass-dim);color:var(--parchment-dim);
    font-size:10px;padding:3px 6px;cursor:pointer;font-family:inherit;
  }

  /* ---------- Courtroom scene ---------- */
  #scene{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,220,150,0.08), transparent 60%),
      linear-gradient(180deg,#2a1a10 0%, #1c1108 70%, #150c06 100%);
    border-bottom:3px solid var(--brass-dim);
    overflow:hidden;
  }
  #benchTop{
    position:absolute;top:0;left:0;right:0;height:26%;
    background:linear-gradient(180deg,#5a3a20,#3a2413);
    border-bottom:4px solid var(--brass-dim);
  }
  #benchTop::after{
    content:"";position:absolute;left:0;right:0;bottom:-4px;height:8px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 8px, var(--brass-dim) 8px 16px);
    opacity:0.5;
  }
  .emblem{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:34px;height:34px;background:var(--brass);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:0.85;
  }
  #opinionGauge{
    position:absolute; left:10px; right:10px; top:calc(26% + 6px);
    display:flex; align-items:center; gap:6px; z-index:2;
  }
  .gaugeLabel{font-size:8px;color:var(--parchment-dim);letter-spacing:1px;white-space:nowrap;}
  .gaugeTrack{flex:1;height:8px;background:rgba(0,0,0,0.4);border:1px solid var(--brass-dim);position:relative;}
  .gaugeMarker{position:absolute;top:-3px;width:6px;height:14px;background:var(--brass);left:50%;transform:translateX(-50%);transition:left .4s ease;}

  .stand{
    position:absolute;bottom:10%;width:86px;height:34%;
    background:linear-gradient(180deg,#5a3a20,#31200f);
    border:2px solid var(--wood-dark);
    border-top:3px solid var(--brass-dim);
  }
  #dockStand{left:50%;transform:translateX(-50%);width:110px;height:30%;bottom:6%;}
  #prosStand{right:6%;}
  #defStand{left:6%;}
  .stand-label{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-size:9px;color:var(--brass);letter-spacing:2px;
    background:rgba(10,6,3,0.75);
    border:1px solid var(--brass-dim);
    padding:2px 8px;
    white-space:nowrap;
    z-index:3;
  }
  .sprite-holder{
    position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,0.5));
    transition:filter .25s;
  }
  .sprite-holder canvas{image-rendering:pixelated;}
  .dim{filter:brightness(0.45) drop-shadow(0 4px 3px rgba(0,0,0,0.5));}
  .active-bounce{animation:bounce 0.7s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-4px);}}

  /* ---------- Dialogue box ---------- */
  #dialogueBox{
    position:relative;
    padding:12px 14px 16px;
    background:linear-gradient(180deg,#20140b,#150c06);
    border-top:3px solid var(--brass);
    min-height:112px;
    flex-shrink:0;
  }
  #dSpeaker{
    display:inline-block;
    font-size:11px; font-weight:bold; letter-spacing:1px;
    padding:2px 8px; margin-bottom:6px;
    border:1px solid var(--brass-dim);
  }
  #dSpeaker.prosecutor{color:#ffb3b3;border-color:var(--crimson-light);}
  #dSpeaker.defense{color:#b3d1ff;border-color:var(--navy-light);}
  #dSpeaker.narrator{color:var(--brass);border-color:var(--brass);}
  #dSpeaker.defendant{color:#e8d2a0;border-color:var(--brass-dim);}
  #dSpeaker.judge{color:var(--parchment);border-color:var(--parchment-dim);}
  #dText{font-size:13.5px;line-height:1.55;min-height:56px;}
  #dNext{
    position:absolute; right:14px; bottom:10px;
    font-size:10px; color:var(--brass); letter-spacing:1px;
    animation:blink 1.1s infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.15;}}
  #dialogueBox.clickable{cursor:pointer;}

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:20;
    background:rgba(8,5,3,0.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px; text-align:center;
    animation:fadeIn .35s ease;
    overflow-y:auto;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .overlay h1{
    font-size:22px;color:var(--brass);letter-spacing:2px;margin:0 0 14px;
    text-shadow:2px 2px 0 #000;
  }
  .overlay h2{font-size:15px;color:var(--parchment);margin:0 0 18px;letter-spacing:1px;}
  .overlay p{font-size:13px;line-height:1.7;color:var(--parchment-dim);max-width:360px;margin:0 0 10px;}
  .lawtext{
    background:rgba(0,0,0,0.3);border:1px solid var(--brass-dim);
    padding:12px 14px;font-size:13px;line-height:1.7;color:var(--parchment);
    max-width:360px;margin:0 0 12px;
  }
  .btn{
    background:linear-gradient(180deg,var(--brass),var(--brass-dim));
    color:#231a12; border:2px solid #1a1410;
    font-family:inherit; font-weight:bold; letter-spacing:1px;
    padding:10px 18px; font-size:13px; margin-top:8px;
    cursor:pointer; box-shadow:0 3px 0 #1a1410;
    width:100%;max-width:320px;
    text-decoration:none;display:inline-block;
  }
  .btn:active{transform:translateY(3px);box-shadow:none;}
  .btn.secondary{
    background:linear-gradient(180deg,#4a3a2a,#2a1f16);color:var(--parchment);
  }
  .btn.danger{background:linear-gradient(180deg,var(--crimson-light),var(--crimson));color:#fff;}
  .btn.small{width:auto;max-width:none;padding:8px 12px;font-size:11px;}
  .credit{font-size:10px;color:var(--parchment-dim);letter-spacing:1px;margin-top:20px;opacity:0.8;}
  .verline{font-size:10px;color:var(--brass-dim);letter-spacing:2px;margin-top:2px;}
  .evidenceCard{
    border:1px solid var(--brass-dim);padding:10px;margin-bottom:8px;
    width:100%;max-width:320px;text-align:left;background:rgba(0,0,0,0.25);
  }
  .archiveRow{font-size:11px;border-bottom:1px solid var(--brass-dim);padding:6px 2px;text-align:left;width:100%;max-width:340px;}
  .newspaper{
    border:2px solid var(--parchment-dim); background:#e9e2ce; color:#1a1410;
    padding:10px 12px; margin-bottom:14px; width:100%; max-width:340px; text-align:center;
  }
  .np-masthead{font-size:11px;letter-spacing:4px;border-bottom:2px solid #1a1410;padding-bottom:4px;margin-bottom:6px;font-weight:bold;}
  .np-headline{font-size:15px;font-weight:bold;line-height:1.3;margin-bottom:4px;}
  .np-sub{font-size:10px;color:#4a3a2a;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

  /* ---------- Verdict panel ---------- */
  #verdictPanel{
    position:absolute; inset:0; z-index:15;
    background:rgba(8,5,3,0.96);
    display:flex; flex-direction:column;
    padding:18px 16px; overflow-y:auto;
  }
  #verdictPanel h2{font-size:14px;color:var(--brass);letter-spacing:1px;margin:0 0 4px;text-align:center;}
  #verdictPanel .sub{font-size:11px;color:var(--parchment-dim);text-align:center;margin-bottom:14px;}
  .verdict-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .vbtn{
    background:linear-gradient(180deg,#3a2a1a,#231a12);
    border:2px solid var(--brass-dim); color:var(--parchment);
    font-family:inherit; font-size:13px; font-weight:bold;
    padding:14px 6px; cursor:pointer; letter-spacing:1px;
  }
  .vbtn:active{background:var(--brass-dim);color:#231a12;}
  .vbtn.severe{border-color:var(--crimson-light);}
  .vbtn.lenient{border-color:var(--navy-light);}

  #yearsPanel{display:none;flex-direction:column;align-items:center;margin-top:10px;}
  #yearsDisplay{
    font-size:30px;letter-spacing:4px;color:var(--brass);
    border:2px solid var(--brass-dim);padding:8px 22px;margin-bottom:8px;
    min-width:110px;text-align:center;background:rgba(0,0,0,0.3);
  }
  #yearsHint{font-size:10px;color:var(--parchment-dim);min-height:14px;margin-bottom:8px;}
  #numpad{display:grid;grid-template-columns:repeat(3,58px);gap:8px;margin-bottom:12px;}
  .numkey{
    background:#2a1f16;border:1px solid var(--brass-dim);color:var(--parchment);
    font-family:inherit;font-size:15px;padding:10px 0;cursor:pointer;
  }
  .numkey:active{background:var(--brass-dim);color:#231a12;}
  .rowbtns{display:flex;gap:10px;}

  #footNote{font-size:10px;color:var(--parchment-dim);text-align:center;margin-top:10px;opacity:0.8;}
</style>
</head>
<body>
<div id="stage">

  <div id="hud">
    <span class="case-label" id="caseLabel">미니법정</span>
    <div id="hudRight">
      <span id="suspicion"></span>
      <button id="evidenceBtn" style="display:none;">🔍 증거</button>
      <button id="summaryBtn" style="display:none;">📜 요약</button>
      <button id="settingsBtn">⚙</button>
      <button id="muteBtn">🔊 소리</button>
    </div>
  </div>

  <div id="scene">
    <div id="benchTop"><div class="emblem"></div></div>
    <div id="opinionGauge">
      <span class="gaugeLabel">검사 우세</span>
      <div class="gaugeTrack"><div class="gaugeMarker" id="gaugeMarker"></div></div>
      <span class="gaugeLabel">변호인 우세</span>
    </div>

    <div class="stand" id="prosStand"><div class="stand-label">검사</div>
      <div class="sprite-holder" id="holder-pros"><canvas class="pixel" id="c-pros" width="112" height="160"></canvas></div>
    </div>
    <div class="stand" id="defStand"><div class="stand-label">변호인</div>
      <div class="sprite-holder" id="holder-def"><canvas class="pixel" id="c-def" width="112" height="160"></canvas></div>
    </div>
    <div class="stand" id="dockStand"><div class="stand-label">피고인</div>
      <div class="sprite-holder" id="holder-defendant"><canvas class="pixel" id="c-defendant" width="126" height="180"></canvas></div>
    </div>
  </div>

  <div id="dialogueBox" class="clickable">
    <div id="dSpeaker" class="narrator">나레이션</div>
    <div id="dText">불러오는 중...</div>
    <div id="dNext">▶ 탭하여 계속</div>
  </div>

  <!-- Verdict Panel -->
  <div id="verdictPanel" style="display:none;">
    <h2 id="vTitle">최종 판결</h2>
    <div class="sub">신중하게 선고하십시오. 지나친 판결은 대가가 따릅니다.</div>
    <div class="verdict-grid" id="verdictGrid">
      <button class="vbtn lenient" data-v="선고유예">선고유예</button>
      <button class="vbtn lenient" data-v="벌금">벌금형</button>
      <button class="vbtn lenient" data-v="집행유예">집행유예</button>
      <button class="vbtn" data-v="징역">징역형</button>
      <button class="vbtn severe" data-v="무기징역">무기징역</button>
      <button class="vbtn severe" data-v="사형">사형</button>
      <button class="vbtn lenient" data-v="무죄" style="grid-column:1/3;">무죄 선고</button>
    </div>

    <div id="yearsPanel">
      <div class="sub">징역 연수를 입력하세요 (1~50년)</div>
      <div id="yearsDisplay">0 년</div>
      <div id="yearsHint"></div>
      <div id="numpad"></div>
      <div class="rowbtns">
        <button class="btn secondary" id="yearsCancel">취소</button>
        <button class="btn" id="yearsConfirm">선고 확정</button>
      </div>
    </div>
    <div id="footNote">숫자 키보드로도 입력할 수 있습니다.</div>
  </div>

  <!-- Full overlays (title / menus / law card / jury / result / ending / archive / evidence / settings) -->
  <div id="overlay" class="overlay" style="display:none;"></div>

</div>

<script>
/* ============================================================
   미니법정 - Mini Court  ver 2.0
   제작자: 최한민
   ============================================================ */

/* ================= Settings ================= */
let settings = { typeSpeed:26, largeText:false, showHint:false, lang:'ko' };
async function loadSettings(){
  try{
    const res = await window.storage.get('settings', false);
    if(res && res.value) Object.assign(settings, JSON.parse(res.value));
  }catch(e){}
  document.getElementById('stage').classList.toggle('large-text', !!settings.largeText);
  syncHudLabels();
}
async function saveSettings(){
  try{ await window.storage.set('settings', JSON.stringify(settings), false); }catch(e){}
}

/* ================= Difficulty ================= */
let difficulty = 'normal';
const DIFFICULTY_MODS = {
  easy:{fairMinAdj:-1, fairMaxAdj:1.5, outrageHighAdj:3, outrageLowAdj:-1},
  normal:{fairMinAdj:0, fairMaxAdj:0, outrageHighAdj:0, outrageLowAdj:0},
  hard:{fairMinAdj:0.7, fairMaxAdj:-0.7, outrageHighAdj:-2, outrageLowAdj:0.7}
};
function adjustedRange(c){
  if(c.fairMin==null) return c;
  const mod = DIFFICULTY_MODS[difficulty] || DIFFICULTY_MODS.normal;
  return {
    fairMin: c.fairMin + mod.fairMinAdj,
    fairMax: c.fairMax + mod.fairMaxAdj,
    outrageHigh: c.outrageHigh!=null ? c.outrageHigh + mod.outrageHighAdj : null,
    outrageLow: c.outrageLow!=null ? c.outrageLow + mod.outrageLowAdj : null
  };
}

/* ================= i18n (menu chrome only - 사건 대사/법률은 한국어 고정) ================= */
const I18N = {
  ko:{
    startTrial:'재판 시작', records:'📖 재판 기록', tutorial:'🎓 튜토리얼',
    modeTitle:'재판 방식 선택', modePrompt:'어떤 방식으로 재판을 진행하시겠습니까?',
    modeSeq:'정식 재판 (순서대로)', modeRandom:'랜덤 재판', modePractice:'사건 선택 (연습 모드)', back:'뒤로',
    diffTitle:'난이도 선택', diffPrompt:'판정 기준의 엄격함을 선택하세요.',
    diffEasy:'초심자 (관대한 판정)', diffNormal:'보통', diffHard:'실전 (엄격한 판정)',
    caseSelectTitle:'사건 선택', caseSelectPrompt:'원하는 사건 하나를 골라 연습해볼 수 있습니다.',
    filterAll:'전체', filterComedy:'코믹만', filterHeavy:'무거운 사건만',
    settingsTitle:'설정', settingsSpeed:'텍스트 속도', settingsFont:'글자 크기', settingsHint:'양형 힌트',
    settingsLang:'언어', contentNote:'※ 사건 대사·법률 내용은 한국어로만 제공됩니다.',
    speedSlow:'느림', speedNormal:'보통', speedFast:'빠름', speedInstant:'즉시 표시',
    fontNormal:'보통', fontBig:'크게', hintOff:'끄기', hintOn:'켜기',
    close:'닫기', evidenceLabel:'증거', summaryLabel:'요약', muteOn:'소리', muteOff:'음소거'
  },
  en:{
    startTrial:'Start Trial', records:'📖 Case Records', tutorial:'🎓 Tutorial',
    modeTitle:'Select Trial Mode', modePrompt:'How would you like to proceed?',
    modeSeq:'Standard Trial (In Order)', modeRandom:'Random Trial', modePractice:'Case Select (Practice)', back:'Back',
    diffTitle:'Select Difficulty', diffPrompt:'Choose how strict the grading should be.',
    diffEasy:'Beginner (Lenient grading)', diffNormal:'Normal', diffHard:'Hardcore (Strict grading)',
    caseSelectTitle:'Select a Case', caseSelectPrompt:'Pick a single case to practice on.',
    filterAll:'All', filterComedy:'Comedy only', filterHeavy:'Heavy cases only',
    settingsTitle:'Settings', settingsSpeed:'Text Speed', settingsFont:'Font Size', settingsHint:'Sentencing Hint',
    settingsLang:'Language', contentNote:'※ Case dialogue and legal text remain in Korean only.',
    speedSlow:'Slow', speedNormal:'Normal', speedFast:'Fast', speedInstant:'Instant',
    fontNormal:'Normal', fontBig:'Large', hintOff:'Off', hintOn:'On',
    close:'Close', evidenceLabel:'Evidence', summaryLabel:'Summary', muteOn:'Sound', muteOff:'Muted'
  }
};
function t(key){
  return (I18N[settings.lang] && I18N[settings.lang][key]) || I18N.ko[key] || key;
}
function setLang(l){
  settings.lang = l;
  saveSettings();
  syncHudLabels();
  showSettings();
}
function syncHudLabels(){
  const ev = el('evidenceBtn'); if(ev) ev.textContent = '🔍 ' + t('evidenceLabel');
  const sm = el('summaryBtn'); if(sm) sm.textContent = '📜 ' + t('summaryLabel');
  const mb = el('muteBtn'); if(mb) mb.textContent = muted ? ('🔇 ' + t('muteOff')) : ('🔊 ' + t('muteOn'));
}

/* ================= Sound Engine ================= */
let audioCtx = null;
let muted = false;
let bgmInterval = null;
let bgmStep = 0;
let ambientNoiseSource = null;
let ambientNoiseGain = null;

function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type, vol, when){
  if(muted || !audioCtx) return;
  when = when||0;
  const t = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol,0.001), t+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t+dur+0.03);
}

function playBlip(kind){
  const bases = {pros:170, def:270, narrator:220, judge:200, defendant:230};
  const base = bases[kind] || 220;
  const f = base + (Math.random()*36 - 18);
  playTone(f, 0.06, 'square', 0.05);
}

function playGavel(){
  if(muted || !audioCtx) return;
  playTone(90, 0.28, 'square', 0.16, 0);
  playTone(60, 0.3, 'sine', 0.18, 0.02);
}

function createNoiseBuffer(duration){
  const bufferSize = Math.floor(audioCtx.sampleRate*duration);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  return buffer;
}

function startCrowdMurmur(){
  if(!audioCtx) return;
  stopCrowdMurmur();
  const buffer = createNoiseBuffer(2);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer; src.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 500;
  const gain = audioCtx.createGain();
  gain.gain.value = muted ? 0 : 0.022;
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start();
  ambientNoiseSource = src;
  ambientNoiseGain = gain;
}
function stopCrowdMurmur(){
  if(ambientNoiseSource){
    try{ ambientNoiseSource.stop(); }catch(e){}
  }
  ambientNoiseSource = null;
  ambientNoiseGain = null;
}

function playDoorSfx(){
  if(muted || !audioCtx) return;
  const buffer = createNoiseBuffer(0.35);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.setValueAtTime(700, audioCtx.currentTime);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.35);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start();
}

function playCrowdReaction(kind){
  if(muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  if(kind==='gasp'){
    const buf=createNoiseBuffer(0.4); const src=audioCtx.createBufferSource(); src.buffer=buf;
    const filter=audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1200;
    const gain=audioCtx.createGain(); gain.gain.setValueAtTime(0.12,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    src.connect(filter).connect(gain).connect(audioCtx.destination); src.start();
  } else if(kind==='murmur'){
    const buf=createNoiseBuffer(0.6); const src=audioCtx.createBufferSource(); src.buffer=buf;
    const filter=audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=400;
    const gain=audioCtx.createGain(); gain.gain.setValueAtTime(0.08,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    src.connect(filter).connect(gain).connect(audioCtx.destination); src.start();
  } else if(kind==='cheer'){
    for(let i=0;i<4;i++) playTone(400+i*80, 0.18, 'triangle', 0.07, i*0.05);
  } else if(kind==='boo'){
    for(let i=0;i<3;i++) playTone(140-i*10, 0.35, 'sawtooth', 0.08, i*0.08);
  } else if(kind==='clap'){
    for(let i=0;i<3;i++){
      const buf=createNoiseBuffer(0.08); const src=audioCtx.createBufferSource(); src.buffer=buf;
      const gain=audioCtx.createGain(); gain.gain.setValueAtTime(0.15,t+i*0.12); gain.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.08);
      src.connect(gain).connect(audioCtx.destination); src.start(t+i*0.12);
    }
  }
}

function startBGM(mode, tag){
  stopBGM();
  let notes, interval, type, vol;
  if(mode==='verdict'){
    notes = VERDICT_NOTES; interval = 260; type = 'sawtooth'; vol = 0.06;
    playGavel();
  } else if(tag==='comedy'){
    notes = AMBIENT_NOTES_COMEDY; interval = 340; type = 'triangle'; vol = 0.045;
    startCrowdMurmur();
  } else if(tag==='heavy'){
    notes = AMBIENT_NOTES_HEAVY; interval = 560; type = 'triangle'; vol = 0.04;
    startCrowdMurmur();
  } else {
    notes = AMBIENT_NOTES; interval = 460; type = 'triangle'; vol = 0.04;
    startCrowdMurmur();
  }
  bgmStep = 0;
  bgmInterval = setInterval(()=>{
    const f = notes[bgmStep % notes.length];
    if(f){
      playTone(f, interval/1000*0.92, type, vol);
      if(mode==='verdict') playTone(f/2, interval/1000*0.92, 'sine', vol*0.85);
    }
    bgmStep++;
  }, interval);
}
function stopBGM(){
  if(bgmInterval) clearInterval(bgmInterval);
  bgmInterval = null;
  stopCrowdMurmur();
}

function applyMood(colorGrid, mood){
  if(!mood || mood==='neutral') return;
  if(mood==='angry'){
    colorGrid[2][5] = '#2a1010';
    colorGrid[2][7] = '#2a1010';
    colorGrid[4][6] = '#7a2230';
    colorGrid[4][7] = '#7a2230';
  } else if(mood==='worried'){
    colorGrid[2][2] = '#8fc7e8';
  } else if(mood==='relieved'){
    colorGrid[4][7] = '#c9824a';
  } else if(mood==='distressed'){
    colorGrid[4][6] = '#2a1a12';
    colorGrid[4][7] = '#2a1a12';
    colorGrid[2][5] = '#2a1010';
    colorGrid[2][7] = '#2a1010';
  }
}

function drawSprite(canvasId, palette, opts){
  opts = opts||{};
  const cv = document.getElementById(canvasId);
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const cols = 14, rows = 20;
  const px = Math.floor(cv.width/cols);
  const offX = Math.floor((cv.width - px*cols)/2);
  const offY = cv.height - px*rows;

  const gridRows = opts.robe
    ? BASE_GRID.map((row,i)=> ROBE_ROWS[i] || row)
    : BASE_GRID;

  const colorGrid = [];
  for(let r=0;r<rows;r++){
    colorGrid.push(new Array(cols).fill(null));
    for(let c=0;c<cols;c++){
      const ch = gridRows[r][c];
      let color = null;
      if(ch==='H') color = palette.hair;
      else if(ch==='S') color = palette.skin;
      else if(ch==='O') color = palette.outfit;
      else if(ch==='A') color = palette.accent;
      else if(ch==='W') color = palette.collar || '#f2ede0';
      else if(ch==='E') color = '#20160f';
      else if(ch==='M') color = '#6b3d2a';
      else if(ch==='B') color = '#161010';
      colorGrid[r][c] = color;
    }
  }

  if(opts.glasses){
    colorGrid[3][4] = '#161010';
    colorGrid[3][8] = '#161010';
    colorGrid[3][5] = '#cfe3f2';
    colorGrid[3][7] = '#cfe3f2';
  }
  if(opts.cuffs){
    colorGrid[8][0] = '#9a9a9a';
    colorGrid[8][13] = '#9a9a9a';
  }
  if(opts.badge){
    colorGrid[8][2] = palette.accent2 || '#c9a24b';
  }
  if(opts.messyHair){
    colorGrid[0][3] = null;
    colorGrid[1][10] = palette.hair;
  }
  applyMood(colorGrid, opts.mood);

  const outline = [];
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(!colorGrid[r][c]) continue;
      for(const [dr,dc] of dirs){
        const nr=r+dr, nc=c+dc;
        if(nr<0||nr>=rows||nc<0||nc>=cols) continue;
        if(!colorGrid[nr][nc]) outline.push([nr,nc]);
      }
    }
  }
  ctx.fillStyle = '#0d0805';
  outline.forEach(([r,c])=>{
    ctx.fillRect(offX + c*px, offY + r*px, px+0.5, px+0.5);
  });

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const color = colorGrid[r][c];
      if(color){
        ctx.fillStyle = color;
        ctx.fillRect(offX + c*px, offY + r*px, px+0.5, px+0.5);
      }
    }
  }
}

/* ================= Scoring ================= */
function computeScore(type, years){
  switch(type){
    case '무죄': return 0;
    case '선고유예': return 1;
    case '벌금': return 2;
    case '집행유예': return 3;
    case '징역': return 3 + Math.min(Math.max(years||1,1),50)*0.2;
    case '무기징역': return 14;
    case '사형': return 16;
    default: return 3;
  }
}
function verdictLabel(type, years){
  if(type==='징역') return `징역 ${years}년`;
  return type;
}

/* ================= Game State ================= */
let state = {
  caseIdx:-1,
  suspicion:0,
  opinion:50,
  dlgQueue:[],
  dlgPos:0,
  currentCase:null,
  history:[],
  _appealUsed:false
};
let activeCaseList = CASES.slice();
let singleCaseMode = false;
let tutorialMode = false;
let caseSelectFilter = 'all';

function renderSuspicion(){
  let html='';
  for(let i=0;i<5;i++){
    html += `<span class="eye ${i<state.suspicion?'on':''}"></span>`;
  }
  el('suspicion').innerHTML = html + `<span style="margin-left:6px;font-size:9px;">시민의심 ${state.suspicion}/5</span>`;
}

function renderGauge(){
  const m = el('gaugeMarker');
  if(m) m.style.left = state.opinion + '%';
}
function updateGauge(delta){
  if(delta==null) return;
  state.opinion = Math.max(0, Math.min(100, state.opinion + delta));
  renderGauge();
}

function setSpeakerVisual(who){
  ['pros','def','defendant'].forEach(k=>{
    const h = el('holder-'+k);
    if(!h) return;
    if(k===who){ h.classList.remove('dim'); h.classList.add('active-bounce'); }
    else { h.classList.add('dim'); h.classList.remove('active-bounce'); }
  });
}

/* ---- typewriter dialogue with blips ---- */
let typingTimer = null;
let typingFull = '';
let typingIndex = 0;
let isTyping = false;

function showDialogue(item, cb){
  const box = el('dialogueBox');
  box.style.display='block';
  const tag = el('dSpeaker');
  tag.className = item.type;
  tag.textContent = item.name;
  setSpeakerVisual(item.who);

  if(item.who==='pros' || item.who==='def'){
    redrawRole(item.who, item.mood||'neutral');
  } else if(item.who==='defendant' && item.type==='defendant'){
    redrawRole('defendant', item.mood||'worried');
  }
  if(item.sfx) playCrowdReaction(item.sfx);

  clearInterval(typingTimer);
  typingFull = item.text;
  typingIndex = 0;
  el('dText').textContent = '';
  el('dNext').style.opacity = 0;

  if(settings.typeSpeed <= 0){
    isTyping = false;
    el('dText').textContent = typingFull;
    el('dNext').style.opacity = 1;
    playBlip(item.who);
  } else {
    isTyping = true;
    typingTimer = setInterval(()=>{
      if(typingIndex < typingFull.length){
        el('dText').textContent += typingFull[typingIndex];
        if(typingIndex % 2 === 0 && typingFull[typingIndex] !== ' '){
          playBlip(item.who);
        }
        typingIndex++;
      } else {
        clearInterval(typingTimer);
        typingTimer = null;
        isTyping = false;
        el('dNext').style.opacity = 1;
      }
    }, settings.typeSpeed);
  }

  box.onclick = ()=>{
    if(isTyping){
      clearInterval(typingTimer);
      typingTimer = null;
      isTyping = false;
      el('dText').textContent = typingFull;
      el('dNext').style.opacity = 1;
    } else {
      box.onclick = null;
      cb && cb();
    }
  };
}

/* ================= Flow control ================= */
function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startGame(mode){
  ensureAudio();
  state.suspicion = 0;
  state.caseIdx = -1;
  state.history = [];
  renderSuspicion();
  activeCaseList = (mode==='random') ? shuffleArr(CASES.slice()) : CASES.slice();
  singleCaseMode = false;
  el('overlay').style.display='none';
  nextCase();
}

function startSingleCase(idx){
  ensureAudio();
  state.suspicion = 0;
  state.caseIdx = -1;
  state.history = [];
  renderSuspicion();
  activeCaseList = [CASES[idx]];
  singleCaseMode = true;
  el('overlay').style.display='none';
  nextCase();
}

function startTutorial(){
  ensureAudio();
  state.suspicion = 0;
  state.caseIdx = -1;
  state.history = [];
  renderSuspicion();
  activeCaseList = [TUTORIAL_CASE];
  singleCaseMode = false;
  tutorialMode = true;

}

function showTutorialDone(){

    <button class="btn" onclick="showTitle()">처음 화면으로</button>`;

function nextCase(){
  state.caseIdx++;
  if(state.caseIdx >= activeCaseList.length){
    stopBGM();
    el('evidenceBtn').style.display='none';
    el('summaryBtn').style.display='none';
    if(tutorialMode){ tutorialMode=false; showTutorialDone(); }
    else if(singleCaseMode) showCaseSelect(caseSelectFilter);
    else showEnding();
    return;
  }
  const c = activeCaseList[state.caseIdx];
  state.currentCase = c;
  state._appealUsed = false;
  state._caseStartTime = Date.now();
  el('caseLabel').textContent = c.title;
  el('verdictPanel').style.display='none';
  state.opinion = 50;
  renderGauge();
  redrawRole('defendant','worried');
  redrawRole('pros','neutral');
  redrawRole('def','neutral');
  el('evidenceBtn').style.display = c.evidence ? 'inline-block' : 'none';
  el('summaryBtn').style.display = 'inline-block';
  startBGM('ambient', c.tag);
  playDoorSfx();
  buildDialogueQueue(c);
  state.dlgPos = 0;
  playQueue();
}

function buildDialogueQueue(c){
  const q = [];
  if(c.callbackFrom){
    const found = state.history.find(h=>h.caseId===c.callbackFrom && h.lenient);
    if(found){
      q.push({type:'narrator', name:'나레이션', text:c.callbackLine, who:'defendant'});
    }
  }
  q.push({type:'narrator', name:'나레이션', text:c.intro, who:'defendant'});
  q.push({type:'prosecutor', name:'검사', text:c.prosOpen, who:'pros', mood:'neutral'});
  q.push({type:'defense', name:'변호인', text:c.defOpen, who:'def', mood:'worried'});
  c.rounds.forEach((r,i)=>{
    const escalate = i >= Math.ceil(c.rounds.length/2);
    q.push({type:'prosecutor', name:'검사', text:r.p, who:'pros', mood: escalate?'angry':'neutral'});
    q.push({type:'defense', name:'변호인', text:r.d, who:'def', mood: escalate?'worried':'neutral', shift:r.momentum});
  });
  q.push({type:'prosecutor', name:'검사 (구형)', text:c.prosFinal, who:'pros', mood:'angry'});
  q.push({type:'defense', name:'변호인 (최후 변론)', text:c.defFinal, who:'def', mood:'worried'});
  q.push({type:'narrator', name:'나레이션', text:'재판장이 피고인에게 마지막 진술 기회를 줍니다.', who:'defendant'});
  q.push({type:'defendant', name:'피고인', text:c.finalStatement, who:'defendant', mood:'worried'});

  if(c.rounds.length>=2 && Math.random()<0.3){
    const ev = RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)];
    const insertPos = Math.max(3, Math.min(q.length-3, 3+Math.floor(Math.random()*(q.length-6))));
    q.splice(insertPos, 0, {type:'narrator', name:'나레이션', text:ev.text, who:null, sfx:ev.sfx});
  }

  state.dlgQueue = q;
}

function playQueue(){
  if(state.dlgPos >= state.dlgQueue.length){
    showLawCard();
    return;
  }
  const item = state.dlgQueue[state.dlgPos];
  showDialogue(item, ()=>{
    if(item.shift) updateGauge(item.shift);
    state.dlgPos++;
    playQueue();
  });
}

function showLawCard(){
  el('dialogueBox').style.display='none';
  setSpeakerVisual(null);
  el('evidenceBtn').style.display='none';
  el('summaryBtn').style.display='none';
  const ov = el('overlay');
  const c = state.currentCase;
  ov.style.display='flex';
  const nextAction = c.juryVerdict ? 'showJuryVerdict()' : 'proceedToVerdict()';
  const btnLabel = c.juryVerdict ? '배심원 평결 확인' : '판결하기';
  ov.innerHTML = `
    <h1>관련 법률</h1>
    <h2>${c.law.article}</h2>
    <div class="lawtext">${c.law.text}</div>
    <p style="color:var(--brass-dim);">${c.law.note}</p>
    ${c.precedent ? `<p style="font-size:11px;">📖 ${c.precedent}</p>` : ''}
    <p style="font-size:10px;">${LAW_FOOTNOTE}</p>
    <button class="btn danger" onclick="${nextAction}">${btnLabel}</button>`;
}

let selectedYears = 0;

function openVerdictPanel(){

function updateYearsHint(){
  const hintEl = el('yearsHint');
  if(!hintEl) return;
  const c = state.currentCase;
  if(!settings.showHint || !c || c.fairMin==null){ hintEl.textContent=''; return; }
  const adj = adjustedRange(c);
  const score = computeScore('징역', selectedYears||1);
  if(score>=adj.fairMin && score<=adj.fairMax) hintEl.textContent='💡 적정 범위에 근접한 편입니다';
  else if(score < adj.fairMin) hintEl.textContent='💡 다소 가벼운 편일 수 있습니다';
  else hintEl.textContent='💡 다소 무거운 편일 수 있습니다';
}

function buildNumpad(){
  const pad = el('numpad');
  pad.innerHTML='';
  const keys = ['1','2','3','4','5','6','7','8','9','←','0','확인'];
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.className='numkey';
    b.textContent = k;
    b.onclick = ()=>{
      if(k==='←'){ selectedYears = Math.floor(selectedYears/10); }
      else if(k==='확인'){ confirmYears(); return; }
      else {
        const n = selectedYears*10 + parseInt(k,10);
        selectedYears = n>50?50:n;
      }
      el('yearsDisplay').textContent = selectedYears + ' 년';
      updateYearsHint();
    };
    pad.appendChild(b);
  });
}

function handleVerdictClick(type){
  if(type==='사형' || type==='무기징역'){
    showConfirmSevere(type);
    return;
  }
  if(type==='징역'){
    selectedYears = 0;
    el('yearsDisplay').textContent = '0 년';
    buildNumpad();
    updateYearsHint();
    el('verdictGrid').style.display='none';
    el('yearsPanel').style.display='flex';
  } else {
    resolveVerdict(type, null);
  }
}

function showConfirmSevere(type){
  const ov = el('overlay');

function confirmYears(){
  if(selectedYears < 1) selectedYears = 1;
  resolveVerdict('징역', selectedYears);
}

document.addEventListener('keydown', (e)=>{
  if(el('yearsPanel').style.display !== 'flex') return;
  if(e.key >= '0' && e.key <= '9'){
    const n = selectedYears*10 + parseInt(e.key,10);
    selectedYears = n>50?50:n;
    el('yearsDisplay').textContent = selectedYears + ' 년';
    updateYearsHint();
  } else if(e.key === 'Backspace'){
    selectedYears = Math.floor(selectedYears/10);
    el('yearsDisplay').textContent = selectedYears + ' 년';
    updateYearsHint();
  } else if(e.key === 'Enter'){
    confirmYears();
  }
});

function resolveVerdict(type, years){
  const c = state.currentCase;
  el('verdictPanel').style.display='none';
  playGavel();
  state._lastElapsedMs = Date.now() - (state._caseStartTime || Date.now());
  const outcome = judge(c, type, years);
  const mood = defendantMoodFor(outcome, type);
  redrawRole('defendant', mood);
  setTimeout(()=>{ showResultOverlay(type, years, outcome); }, 900);
}

function judge(c, type, years){
  if(c.disallowed && c.disallowed.includes(type)){
    return {kind:'distortion_illegal'};
  }
  if(c.guilty === false){
    if(type === '무죄') return {kind:'correct_acquittal'};
    return {kind:'distortion_innocent'};
  }
  if(type === '무죄') return {kind:'suspicion'};
  const adj = adjustedRange(c);
  const score = computeScore(type, years);
  if(adj.outrageHigh!=null && score > adj.outrageHigh) return {kind:'distortion_harsh'};
  if(adj.outrageLow!=null && score < adj.outrageLow) return {kind:'distortion_lenient'};
  if(score >= adj.fairMin && score <= adj.fairMax) return {kind:'fair'};
  if(score < adj.fairMin) return {kind:'mild_lenient'};
  return {kind:'mild_harsh'};
}

function pushHistory(c, type, years, outcome){
  const score = type==='무죄' ? 0 : computeScore(type, years);
  const fairMid = (c.fairMin!=null && c.fairMax!=null) ? (c.fairMin+c.fairMax)/2 : null;
  let juryMatch = null;
  if(c.juryVerdict){
    const jScore = computeScore('징역', c.juryVerdict.years);
    juryMatch = Math.abs(score - jScore) <= 2.2;
  }
  state.history.push({
    caseId:c.id, type, years,
    lenient:['벌금','집행유예','선고유예','무죄'].includes(type),
    score, fairMid, juryMatch, outcomeKind: outcome.kind,
    elapsedMs: state._lastElapsedMs || 0
  });
}

async function recordResult(c, label, resultKind){
  try{
    let records = [];
    try{
      const res = await window.storage.get('archive', false);
      if(res && res.value) records = JSON.parse(res.value);
    }catch(e){ records = []; }
    records.push({title:c.title, verdict:label, resultLabel: RESULT_LABELS[resultKind]||resultKind, ts:Date.now(), elapsedMs: state._lastElapsedMs||0});
    await window.storage.set('archive', JSON.stringify(records), false);
  }catch(e){ /* storage unavailable - ignore */ }
}

async function saveAchievements(ids){
  if(!ids.length) return;
  try{
    let all = [];
    try{
      const res = await window.storage.get('achievements', false);
      if(res && res.value) all = JSON.parse(res.value);
    }catch(e){ all = []; }
    ids.forEach(id=>{ if(!all.includes(id)) all.push(id); });
    await window.storage.set('achievements', JSON.stringify(all), false);
  }catch(e){}
}

/* ================= Newspaper headline ================= */
function craftHeadline(c, type, years, outcome){
  const label = verdictLabel(type, years);
  const shortTitle = c.title.replace(/^사건 \d+\.\s*/, '');
  switch(outcome.kind){
    case 'distortion_innocent': return {head:'무고한 시민에게 유죄 선고', sub:'법정, 오판 논란으로 발칵'};
    case 'distortion_illegal': return {head:'존재하지 않는 형벌 선고', sub:'위법 판결 파문... 상급심 파기'};
    case 'distortion_harsh': return {head:`"${label}"... 과잉 처벌 논란`, sub:'시민단체 강력 반발'};
    case 'distortion_lenient': return {head:`"${label}"... 솜방망이 처벌 논란`, sub:'여론 싸늘'};
    case 'correct_acquittal': return {head:'무죄 확정, 누명 벗은 시민', sub:'법정 앞 안도의 눈물'};
    case 'suspicion': return {head:'또 다시 무죄 선고', sub:'"판사가 범죄를 감싸주나" 시민 분노'};
    case 'fair': return {head:`${shortTitle}, "${label}" 선고`, sub:'대체로 수긍하는 여론'};
    case 'mild_lenient': return {head:`"${label}"... 다소 관대하다는 반응`, sub:'논란까지는 아니야'};
    case 'mild_harsh': return {head:`"${label}"... 다소 무겁다는 반응`, sub:'논란까지는 아니야'};
    default: return {head:'선고 완료', sub:label};
  }
}
function newspaperHTML(h){
  return `<div class="newspaper">
    <div class="np-masthead">법 정 일 보</div>
    <div class="np-headline">${h.head}</div>
    <div class="np-sub">${h.sub}</div>
  </div>`;
}

  if(outcome.kind === 'distortion_innocent'){
    stopBGM();
    ov.innerHTML = `${npHtml}
      <h1>THE END</h1>
      <h2>법왜곡죄 - 패배</h2>
      <p>선고: <b>${label}</b></p>

  }
  if(outcome.kind === 'distortion_illegal'){
    stopBGM();
    ov.innerHTML = `${npHtml}
      <h1>THE END</h1>
      <h2>법왜곡죄 - 패배</h2>
      <p>선고: <b>${label}</b></p>
      <p>이 죄에는 존재하지 않는 형벌을 선고했습니다. 상급심은 이를 명백한 위법 판결로 보아 파기했고, 당신은 '법왜곡죄' 혐의로 고소당했습니다.</p>
      <button class="btn" onclick="restartGame()">처음 화면으로</button>`;
    return;
  }
  if(outcome.kind === 'distortion_harsh' || outcome.kind === 'distortion_lenient'){
    stopBGM();
    const reason = outcome.kind==='distortion_harsh'
      ? '죄질에 비해 지나치게 가혹한 판결이라는 여론이 들끓었습니다.'
      : '중대한 범죄에 비해 지나치게 관대한 판결이라는 비판이 쏟아졌습니다.';
    ov.innerHTML = `${npHtml}
      <h1>THE END</h1>
      <h2>법왜곡죄 - 패배</h2>
      <p>선고: <b>${label}</b></p>
      <p>${reason} 형평성을 잃은 판결로 당신은 결국 '법왜곡죄' 혐의로 고소당했습니다.</p>
      <button class="btn" onclick="restartGame()">처음 화면으로</button>`;
    return;
  }
  if(outcome.kind === 'correct_acquittal'){
    pushHistory(c, type, years, outcome);
    ov.innerHTML = `${npHtml}
      <h2>무죄 선고</h2>
      <p>알리바이와 증거를 근거로 냉정하게 판단한 정당한 무죄 판결입니다. 무고한 시민이 억울한 옥살이를 면했습니다.</p>
      <button class="btn" onclick="proceedNext()">다음 사건으로</button>`;
    return;
  }

  let bump = 0;
  const messages = [];

  if(outcome.kind === 'suspicion'){
    bump += 1;
    const line = SUSPICION_LINES[Math.floor(Math.random()*SUSPICION_LINES.length)];
    messages.push(`<p>${line}</p>`);
  } else {
    let commentary = '균형 잡힌 판결로 받아들여졌습니다.';
    if(outcome.kind==='mild_lenient') commentary='다소 관대하다는 뒷말이 있었지만, 논란까지는 아니었습니다.';
    if(outcome.kind==='mild_harsh') commentary='다소 무겁다는 뒷말이 있었지만, 논란까지는 아니었습니다.';
    messages.push(`<p>${commentary}</p>`);
  }

  if(c.juryVerdict){
    const jScore = computeScore('징역', c.juryVerdict.years);
    const myScore = type==='무죄' ? 0 : computeScore(type, years);
    const diff = Math.abs(myScore - jScore);
    if(diff <= 2.2){
      messages.push(`<p style="color:var(--ok);">배심원의 평결과 대체로 일치하는 판결이었습니다.</p>`);
    } else {
      messages.push(`<p style="color:var(--danger);">배심원의 평결과 다른 판결이었습니다. 법적으로 문제는 없었으나 여론은 크게 엇갈렸습니다.</p>`);
      bump += 1;
    }
  }

  if(!wasAppealFlag && (outcome.kind==='mild_lenient'||outcome.kind==='mild_harsh') && Math.random()<0.4){
    state._appealUsed = true;
    state._appealShown = true;
    showAppealEvent(outcome);
    return;
  }

  pushHistory(c, type, years, outcome);

  state.suspicion = Math.min(5, state.suspicion + bump);
  if(bump>0) renderSuspicion();

  if(state.suspicion >= 5){
    stopBGM();
    ov.innerHTML = `${npHtml}
      <h1>THE END</h1>
      <h2>신뢰를 잃은 판사 - 패배</h2>
      ${messages.join('')}

      <p>거듭된 신뢰 상실로 당신은 결국 판사직에서 물러나야 했습니다.</p>
      <button class="btn" onclick="restartGame()">처음 화면으로</button>`;
    return;
  }

  ov.innerHTML = `${npHtml}
    <h2>선고 완료</h2>
    <p>선고: <b>${label}</b></p>
    ${messages.join('')}
    ${bump>0 ? `<p style="color:var(--brass);">시민의심 ${state.suspicion}/5</p>` : ''}
    <button class="btn" onclick="proceedNext()">다음 사건으로</button>`;
}

/* ================= Judge profile / achievements ================= */
function computeJudgeProfile(){
  const entries = state.history.filter(h=>h.fairMid!=null);
  if(!entries.length) return '데이터 부족';
  let diffSum = 0;
  entries.forEach(h=>{ diffSum += (h.score - h.fairMid); });
  const avg = diffSum/entries.length;
  if(avg > 1.0) return '원칙주의형 (엄격한 판사)';
  if(avg < -1.0) return '온정주의형 (관대한 판사)';
  return '균형형 판사';
}
function computeAchievements(){
  return ACHIEVEMENTS.filter(a=>a.check(state.history));
}

/* ================= Share card & judgment document ================= */
function generateShareCard(){
  const canvas = document.createElement('canvas');
  canvas.width=480; canvas.height=640;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#2b1c12'; ctx.fillRect(0,0,480,640);
  ctx.strokeStyle='#c9a24b'; ctx.lineWidth=6; ctx.strokeRect(10,10,460,620);
  ctx.fillStyle='#c9a24b'; ctx.font='bold 28px monospace'; ctx.textAlign='center';
  ctx.fillText('미니법정', 240, 90);
  ctx.font='16px monospace'; ctx.fillStyle='#ece1c4';
  ctx.fillText(`등급: ${state._lastGrade||''}`, 240, 170);
  ctx.fillText(`성향: ${state._lastProfile||''}`, 240, 205);
  ctx.fillText(`처리 사건: ${activeCaseList.length}건`, 240, 240);
  ctx.fillText(`시민의심: ${state.suspicion}/5`, 240, 275);
  ctx.font='11px monospace'; ctx.fillStyle='#8a6d33';
  ctx.fillText('ver 2.0 · 제작: 최한민', 240, 600);
  const url = canvas.toDataURL('image/png');
  const ov = el('overlay');
  ov.innerHTML = `<h1>결과 카드</h1>
    <img src="${url}" style="width:240px;border:2px solid var(--brass-dim);margin-bottom:12px;"/>
    <a href="${url}" download="미니법정_결과카드.png" class="btn">이미지 다운로드</a>
    <button class="btn secondary" onclick="showEnding()">돌아가기</button>`;
}

function downloadJudgmentDocument(){
  let text = '=== 미니법정 판결문 모음 (ver 2.0) ===\n\n';
  state.history.forEach((h,i)=>{
    const c = CASES.find(cc=>cc.id===h.caseId);
    text += `사건번호: 2026고합${1000+i}\n`;
    text += `사건명: ${c ? c.title : h.caseId}\n`;
    text += `주문: ${verdictLabel(h.type,h.years)}\n`;
    text += `이유: ${c ? c.law.article : ''} 등 관련 법리와 공판정에서의 심리 결과를 종합하여 위와 같이 주문한다.\n`;
    text += `\n----------------------------------------\n\n`;
  });
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '미니법정_판결문.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= Ending ================= */
function showEnding(){
  const ov = el('overlay');
  ov.style.display='flex';
  let grade = '명판사';
  if(state.suspicion>=3) grade='아슬아슬한 판사';
  else if(state.suspicion>=1) grade='보통 판사';
  const profile = computeJudgeProfile();
  state._lastGrade = grade;
  state._lastProfile = profile;
  const earned = computeAchievements();
  saveAchievements(earned.map(a=>a.id));

  let fastestHtml = '';
  const timed = state.history.filter(h=>h.elapsedMs);
  if(timed.length){
    const fastest = timed.reduce((a,b)=> a.elapsedMs<b.elapsedMs ? a : b);
    const fc = CASES.find(cc=>cc.id===fastest.caseId);
    fastestHtml = `<p>⏱ 가장 빠른 판결: ${fc?fc.title:fastest.caseId} (${(fastest.elapsedMs/1000).toFixed(1)}초)</p>`;
  }

  ov.innerHTML = `
    <h1>재판 종료</h1>
    <h2>등급: ${grade}</h2>
    <p>성향 분석: <b>${profile}</b></p>
    <p>총 ${activeCaseList.length}건의 재판을 무사히 마쳤습니다. 최종 시민의심 수치: ${state.suspicion}/5</p>
    ${fastestHtml}
    ${earned.length ? `<div class="lawtext">🏅 이번 재판에서 획득한 업적<br>${earned.map(a=>`${a.name} - ${a.desc}`).join('<br>')}</div>` : ''}
    <button class="btn" onclick="generateShareCard()">🖼 결과 카드 만들기</button>
    <button class="btn secondary" onclick="downloadJudgmentDocument()">📄 판결문 다운로드</button>
    <button class="btn secondary" onclick="restartGame()">처음 화면으로</button>`;
}

function restartGame(){
  showTitle();
}

/* ================= Menus ================= */
function showTitle(){
  el('evidenceBtn').style.display='none';
  el('summaryBtn').style.display='none';
  stopBGM();
  syncHudLabels();
  const ov = el('overlay');
  ov.style.display='flex';
  ov.innerHTML = `
    <h1>미니법정</h1>
    <p>당신은 형사법원의 판사입니다.<br>검사와 변호인의 공방을 듣고,<br>최종 판결을 내리십시오.</p>
    <p style="font-size:11px;color:var(--parchment-dim);">무고한 사람에게 유죄를 내리거나<br>죄질에 맞지 않는 터무니없는 판결을 내리면<br>'법왜곡죄'로 당신이 고소당합니다.<br><br>죄를 지은 자를 함부로 풀어주면<br>시민들의 의심을 사게 됩니다.</p>
    <button class="btn" onclick="showDifficultySelect()">${t('startTrial')}</button>
    <button class="btn secondary" onclick="startTutorial()">${t('tutorial')}</button>
    <button class="btn secondary" onclick="showArchive()">${t('records')}</button>
    <div class="credit">제작자: 최한민</div>
    <div class="verline">ver 2.0</div>`;
}

function showDifficultySelect(){
  el('evidenceBtn').style.display='none';
  el('summaryBtn').style.display='none';
  const ov = el('overlay');
  ov.style.display='flex';
  ov.innerHTML = `
    <h1>${t('diffTitle')}</h1>
    <p>${t('diffPrompt')}</p>
    <button class="btn" onclick="setDifficulty('easy')">${t('diffEasy')}</button>
    <button class="btn" onclick="setDifficulty('normal')">${t('diffNormal')}</button>
    <button class="btn" onclick="setDifficulty('hard')">${t('diffHard')}</button>
    <button class="btn secondary" onclick="showTitle()">${t('back')}</button>`;
}
function setDifficulty(level){
  difficulty = level;
  showModeSelect();
}

function showModeSelect(){
  el('evidenceBtn').style.display='none';
  el('summaryBtn').style.display='none';
  const ov = el('overlay');
  ov.style.display='flex';
  ov.innerHTML = `
    <h1>${t('modeTitle')}</h1>
    <p>${t('modePrompt')}</p>
    <button class="btn" onclick="startGame('sequential')">${t('modeSeq')}</button>
    <button class="btn" onclick="startGame('random')">${t('modeRandom')}</button>
    <button class="btn secondary" onclick="showCaseSelect('all')">${t('modePractice')}</button>
    <button class="btn secondary" onclick="showDifficultySelect()">${t('back')}</button>`;
}

function showCaseSelect(filter){
  caseSelectFilter = filter || 'all';
  el('evidenceBtn').style.display='none';
  el('summaryBtn').style.display='none';
  const ov = el('overlay');
  ov.style.display='flex';
  const list = caseSelectFilter==='all' ? CASES : CASES.filter(c=>(c.tag||'normal')===caseSelectFilter);
  const filterBtns = `
    <div class="btnrow" style="margin-bottom:10px;">
      <button class="btn secondary small" onclick="showCaseSelect('all')">${t('filterAll')}</button>
      <button class="btn secondary small" onclick="showCaseSelect('comedy')">${t('filterComedy')}</button>
      <button class="btn secondary small" onclick="showCaseSelect('heavy')">${t('filterHeavy')}</button>
    </div>`;
  const items = list.map(c=>{
    const idx = CASES.indexOf(c);
    return `<button class="btn secondary" onclick="startSingleCase(${idx})">${c.title}</button>`;
  }).join('');
  ov.innerHTML = `<h1>${t('caseSelectTitle')}</h1><p style="font-size:11px;">${t('caseSelectPrompt')}</p>${filterBtns}${items}<button class="btn secondary" onclick="showModeSelect()">${t('back')}</button>`;
}

/* ================= Init ================= */
document.querySelectorAll('.vbtn').forEach(b=>{
  b.addEventListener('click', ()=>handleVerdictClick(b.dataset.v));
});
el('yearsCancel').addEventListener('click', ()=>{
  el('yearsPanel').style.display='none';
  el('verdictGrid').style.display='grid';
});
el('yearsConfirm').addEventListener('click', confirmYears);
el('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  el('muteBtn').textContent = muted? '🔇 음소거' : '🔊 소리';
  if(ambientNoiseGain) ambientNoiseGain.gain.value = muted? 0 : 0.022;
});
el('evidenceBtn').addEventListener('click', showEvidence);
el('summaryBtn').addEventListener('click', showSummary);
el('settingsBtn').addEventListener('click', showSettings);

initSprites();
renderSuspicion();
renderGauge();
loadSettings();
showTitle();
</script>
</body>
